plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('MEATHOUSE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('MEATHOUSE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MEATHOUSE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MEATHOUSE_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }
def alaApiKey = System.getenv('MEATHOUSE_ALA_API_KEY') ?: ''
def escapedAlaApiKey = alaApiKey.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'au.com.meathouseskewer.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'au.com.meathouseskewer.bridge'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.3.0'
        buildConfigField 'String', 'ALA_API_KEY', '"' + escapedAlaApiKey + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.core:core:1.15.0'
}
