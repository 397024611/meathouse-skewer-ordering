name: Build Android Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'android-bridge/app/**'
      - 'android-bridge/build.gradle'
      - 'android-bridge/settings.gradle'
      - '.github/workflows/build-android-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-bridge/app/**'
      - 'android-bridge/build.gradle'
      - 'android-bridge/settings.gradle'
      - '.github/workflows/build-android-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p android-bridge assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MeatHouse-Skewer-Bridge-APK
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish latest APK to repository and website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p android-bridge/releases public
          cp android-bridge/app/build/outputs/apk/debug/app-debug.apk android-bridge/releases/MeatHouse-Skewer-Bridge-latest.apk
          cp android-bridge/app/build/outputs/apk/debug/app-debug.apk public/bridge.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-bridge/releases/MeatHouse-Skewer-Bridge-latest.apk public/bridge.apk
          git commit -m "Publish latest Meat House Bridge APK" || exit 0
          git pull --rebase origin main
          git push
