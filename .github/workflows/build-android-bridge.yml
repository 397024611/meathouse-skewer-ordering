name: Build Android Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'android-bridge/app/**'
      - 'android-bridge/build.gradle'
      - 'android-bridge/settings.gradle'
      - 'android-bridge/gradle.properties'
      - '.github/workflows/build-android-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-bridge/app/**'
      - 'android-bridge/build.gradle'
      - 'android-bridge/settings.gradle'
      - 'android-bridge/gradle.properties'
      - '.github/workflows/build-android-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK for pull request
        if: github.event_name == 'pull_request'
        run: gradle -p android-bridge assembleDebug --stacktrace

      - name: Validate release signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.MEATHOUSE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEATHOUSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEATHOUSE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "MEATHOUSE_KEYSTORE_B64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "MEATHOUSE_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "MEATHOUSE_KEY_ALIAS is missing"; exit 1; }

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.MEATHOUSE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meathouse-bridge-release.jks"
          chmod 600 "$RUNNER_TEMP/meathouse-bridge-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          MEATHOUSE_KEYSTORE_PATH: ${{ runner.temp }}/meathouse-bridge-release.jks
          MEATHOUSE_KEYSTORE_PASSWORD: ${{ secrets.MEATHOUSE_KEYSTORE_PASSWORD }}
          MEATHOUSE_KEY_ALIAS: ${{ secrets.MEATHOUSE_KEY_ALIAS }}
          MEATHOUSE_KEY_PASSWORD: ${{ secrets.MEATHOUSE_KEYSTORE_PASSWORD }}
        run: gradle -p android-bridge assembleRelease --stacktrace

      - name: Verify signed release certificate
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs android-bridge/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs android-bridge/app/build/outputs/apk/release/app-release.apk | grep -Fi "22e56f1011119ebd292363eebd29830b5c85a5a042d7a9653afc4f3af50bc3a4"

      - uses: actions/upload-artifact@v4
        with:
          name: MeatHouse-Skewer-Bridge-APK
          path: ${{ github.event_name == 'pull_request' && 'android-bridge/app/build/outputs/apk/debug/app-debug.apk' || 'android-bridge/app/build/outputs/apk/release/app-release.apk' }}
          if-no-files-found: error

      - name: Publish signed APK to repository and website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p android-bridge/releases public
          cp android-bridge/app/build/outputs/apk/release/app-release.apk android-bridge/releases/MeatHouse-Skewer-Bridge-latest.apk
          cp android-bridge/app/build/outputs/apk/release/app-release.apk public/bridge.apk
          VERSION_CODE="$(sed -n "s/.*versionCode[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p" android-bridge/app/build.gradle | head -1)"
          VERSION_NAME="$(sed -n "s/.*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" android-bridge/app/build.gradle | head -1)"
          APK_SHA256="$(sha256sum public/bridge.apk | awk '{print $1}')"
          cat > public/bridge-version.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://meathouseskewer.com.au/bridge.apk",
            "sha256": "$APK_SHA256",
            "notes": "A signed Meat House Bridge update is available."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-bridge/releases/MeatHouse-Skewer-Bridge-latest.apk public/bridge.apk public/bridge-version.json
          git commit -m "Publish signed Meat House Bridge APK" || exit 0
          git pull --rebase origin main
          git push
